# global parameters
project_name: 'the-stack-v2-full-Python'
dataset_path: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/samples'  # path to your dataset directory or file
export_path: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/pipeline/shell-sample.parquet'
text_keys: 'text'
use_cache: true
ds_cache_dir: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/pipeline/cache'
np: 10  # number of subprocess to process your dataset
open_tracer: true

# process schedule
# a list of several process operators with their arguments
process:
  - clean_email_mapper:
  - clean_links_mapper:
  - fix_unicode_mapper:
  - punctuation_normalization_mapper:
  - whitespace_normalization_mapper:
  - clean_copyright_mapper:
#   - code_syntax_error_filter:
  - alphanumeric_filter:
      tokenization: False
      min_ratio: 0.38
      max_ratio: 0.94
  - alphanumeric_filter:
      tokenization: True
      min_ratio: 0.51
      max_ratio: 2.87
  - average_line_length_filter:
      min_len: 8
      max_len: 90
  - character_repetition_filter:
      rep_len: 10
      min_ratio: 0.01
      max_ratio: 0.45
  - maximum_line_length_filter:
      min_len: 13
      max_len: 445
  - text_length_filter:
      min_len: 25
  - words_num_filter:
      lang: en
      tokenization: False
      min_num: 5
      max_num: 1600
  - word_repetition_filter:
      lang: en
      tokenization: False
      rep_len: 10
      max_ratio: 0.60
