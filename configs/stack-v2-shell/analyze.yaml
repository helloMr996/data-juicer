# global parameters
project_name: 'the-stack-v2-full-Python'
dataset_path: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/samples'  # path to your dataset directory or file
export_path: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/analyze/chunk_0_3.parquet'
text_keys: 'text'
use_cache: true
ds_cache_dir: '/mnt/tmp/apps/cmss-yangjiandong/data/shell/analyze/cache'
np: 10  # number of subprocess to process your dataset
open_tracer: true

# process schedule
# a list of several process operators with their arguments
process:
  - alphanumeric_filter:
      tokenization: False

  - alphanumeric_filter:
      tokenization: True
  
  - average_line_length_filter:
 
  - character_repetition_filter:
      rep_len: 10
 
  - maximum_line_length_filter:

  - text_length_filter:
   
  - words_num_filter:
      lang: en
      tokenization: False
   
  - word_repetition_filter:
      lang: en
      tokenization: False
      rep_len: 10
      