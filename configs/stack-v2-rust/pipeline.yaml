# global parameters
project_name: 'the-stack-v2-rust'
dataset_path: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/rust'  # path to your dataset directory or file
export_path: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/pipeline/rust/the-stack-v2-rust-fliter.parquet'
text_keys: 'text'
use_cache: true
ds_cache_dir: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/pipeline/rust/cache'
np: 10  # number of subprocess to process your dataset
open_tracer: true
trace_num: 100

# process schedule
# a list of several process operators with their arguments
process:
  - alphanumeric_filter:
      tokenization: False
      min_ratio: 0.32
      max_ratio: 0.78
  - alphanumeric_filter:
      tokenization: True
      min_ratio: 0.72
      max_ratio: 2.79
  - average_line_length_filter:
      min_len: 12
      max_len: 51
  - character_repetition_filter:
      rep_len: 10
      min_ratio: 0.0
      max_ratio: 0.41
  - maximum_line_length_filter:
      min_len: 14
      max_len: 290
  - text_length_filter:
      min_len: 31
  - words_num_filter:
      lang: en
      tokenization: False
      min_num: 4
      max_num: 3839
  - word_repetition_filter:
      lang: en
      tokenization: False
      rep_len: 10
      max_ratio: 0.58
  - clean_email_mapper:
  - clean_links_mapper:
  - fix_unicode_mapper:
  - punctuation_normalization_mapper:
  - whitespace_normalization_mapper:
  - clean_copyright_mapper:
      

