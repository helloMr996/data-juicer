# global parameters
project_name: 'the-stack-v2-kotlin'
dataset_path: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/Kotlin-bak'  # path to your dataset directory or file
export_path: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/piple/Kotlin/the-stack-v2-kotlin-filter.parquet'
text_keys: 'text'
use_cache: true
ds_cache_dir: '/mnt/tmp/apps/cmss-yangjiandong/data/the-stack-v2-other/piple/Kotlin/cache'
np: 10  # number of subprocess to process your dataset
open_tracer: true

# process schedule
# a list of several process operators with their arguments
process:
  - clean_email_mapper:
  - clean_links_mapper:
  - fix_unicode_mapper:
  - punctuation_normalization_mapper:
  - whitespace_normalization_mapper:
  - clean_copyright_mapper:
#   - code_syntax_error_filter:
  - alphanumeric_filter:
      tokenization: False
      min_ratio: 0.42
      max_ratio: 0.86
  - alphanumeric_filter:
      tokenization: True
      min_ratio: 1.02
      max_ratio: 3.34
  - average_line_length_filter:
      min_len: 12
      max_len: 55
  - character_repetition_filter:
      rep_len: 10
      min_ratio: 0.01
      max_ratio: 0.36
  - maximum_line_length_filter:
      min_len: 29
      max_len: 271
  - text_length_filter:
      min_len: 54
  - words_num_filter:
      lang: en
      tokenization: False
      min_num: 5
      max_num: 1173
  - word_repetition_filter:
      lang: en
      tokenization: False
      rep_len: 10
      max_ratio: 0.38